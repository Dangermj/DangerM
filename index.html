<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>حسابدار من</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme=light]{--bg:#e9eef0;--b1:#a7f3d0aa;--b2:#bfdbfeaa;--card:rgba(255,255,255,.55);--tx:#16201f;--mut:#667370;--line:rgba(0,0,0,.08);--acc:#0f766e;--red:#c0392b;--grn:#15803d;--amb:#b45309;--onacc:#fff;color-scheme:light}
[data-theme=dark]{--bg:#0b0f10;--b1:#0f766e55;--b2:#4338ca44;--card:rgba(255,255,255,.06);--tx:#eef2f1;--mut:#97a3a0;--line:rgba(255,255,255,.1);--acc:#2dd4bf;--red:#f87171;--grn:#4ade80;--amb:#fbbf24;--onacc:#06201c;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Vazirmatn,Tahoma,system-ui,sans-serif;padding-bottom:96px}
main{max-width:560px;margin:auto;padding:14px}
h2{font-size:16px;margin:20px 2px 10px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.big{font-size:20px;font-weight:800}.mut{color:var(--mut);font-size:13.5px}
.red{color:var(--red)}.grn{color:var(--grn)}.amb{color:var(--amb)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ic{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.l{display:flex;align-items:center;gap:10px;min-width:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 2px;font:inherit;font-size:12px}
nav button b{display:block;font-size:20px;line-height:1.2}nav button.on{color:var(--acc);font-weight:800}
button{font:inherit}
button.p{background:var(--acc);color:var(--onacc);border:0;border-radius:12px;padding:11px 16px;font-weight:600}
button.g{background:none;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:8px 12px}
button.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;margin:3px 0 8px}
input[type=checkbox]{width:auto;margin:0 0 0 8px;transform:scale(1.2)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 10px}
.chip{border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg);font-size:14.5px}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;overflow:auto}
#sheet>div{background:var(--bg);max-width:560px;margin:24px auto 70px;border-radius:18px;padding:14px}
.fab{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;font-size:30px;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:0}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg .chip{flex:1;text-align:center}
.leg{display:flex;align-items:center;gap:8px;font-size:14px;margin:3px 0}.leg i{width:11px;height:11px;border-radius:4px;flex:none}
.sw{display:flex;align-items:center;margin:6px 0 10px}
.ig{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;margin-bottom:8px}.ig span{width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:21px;border:1px solid var(--line)}.ig span.on{border-color:var(--acc);background:var(--card)}
svg text{font-family:Vazirmatn,Tahoma,sans-serif;fill:var(--mut)}
body{background-color:var(--bg);background-image:radial-gradient(circle at 15% 8%,var(--b1),transparent 45%),radial-gradient(circle at 85% 85%,var(--b2),transparent 45%);background-attachment:fixed;min-height:100vh}
.card,nav{backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5)}
.card{border-radius:20px;box-shadow:0 2px 24px rgba(0,0,0,.04)}
nav{background:var(--card)}
input,select,textarea,.chip,.ic,.bar,.ig span{background:rgba(127,127,127,.12)}
.chip.on{background:var(--acc)}
#sheet{backdrop-filter:blur(8px)}#sheet>div{border:1px solid var(--line)}
.lk{cursor:pointer}.lk:active{opacity:.7}
.bdg{font-size:11px;background:var(--acc);color:var(--onacc);border-radius:8px;padding:1px 7px;margin-inline:4px}
.dg{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.dg span{border:1px solid var(--line);border-radius:9px;padding:1px 9px;font-size:12.5px;background:rgba(127,127,127,.12);color:var(--tx)}
#th{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:6;padding:6px 10px;border-radius:14px;background:var(--card)}
@media(min-width:900px){nav{top:14px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);width:560px;border-radius:22px;border:1px solid var(--line);padding:0}body{padding-top:84px}main{max-width:1040px}#app{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}#app>*{margin:0}#app>h2{margin:14px 2px 0}#app>h2,#app>.grid,#app>.seg,#app>.full{grid-column:1/-1}.fab{bottom:24px}}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tb{margin:0;min-width:0;overflow:hidden}
.tl{padding:9px 0;border-bottom:1px solid var(--line)}.tl:last-child{border:0}.tlw{padding:4px 14px}
.acts{display:flex}.acts button{padding:4px 6px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
@media(min-width:900px){.tg{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<button class="g" id="th" onclick="toggleTheme()">🌓</button>
<main id="app"></main>
<button class="p fab" onclick="openAdd()">+</button>
<div id="sheet"><div id="sheetIn"></div></div>
<nav id="nav"></nav>
<script>
const CFG={url:'',key:''}; // Supabase: url و anon key را اینجا بگذار
let A=null,tm,sy='';const AK='hesab_auth',TK='hesab_theme';
try{A=JSON.parse(localStorage.getItem(AK))}catch(e){}
const applyTheme=()=>{let t=null;try{t=localStorage.getItem(TK)}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')};
const toggleTheme=()=>{try{localStorage.setItem(TK,document.documentElement.dataset.theme==='dark'?'light':'dark')}catch(e){}applyTheme()};applyTheme();
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const TYPES={exp:'خرج',inc:'درآمد',lend:'طلب (قرض دادم)',borrow:'بدهی (قرض گرفتم)'};
const ICONS='💵 🏠 🏋️ 🚗 🚌 ⛽ 🍔 🍕 ☕ 🛒 👕 💊 🏥 📚 🎓 📱 💻 🎮 🎬 ✈️ 🏨 🎁 💡 💧 🔥 📶 🧾 💳 🏦 💰 📈 🐾 🧴 💇 🔧 🧹 👶 🎂 🍎 🥩 🛍️ ⚽ 🎵 🚕 🏖️ 🧳 🪙 🤝 🔄 🎯'.split(' ');
const PAL=['#0f766e','#d97706','#7c3aed','#db2777','#2563eb','#65a30d','#dc2626','#0891b2'];
const KEY='hesab_v1';
let S={cats:[{id:'c1',name:'خوراک',type:'exp',icon:'🍔'},{id:'c2',name:'حمل‌ونقل',type:'exp',icon:'🚗'},{id:'c3',name:'قبوض',type:'exp',icon:'💡'},{id:'c4',name:'خرید',type:'exp',icon:'🛒'},{id:'c5',name:'قسط',type:'exp',icon:'🧾'},{id:'c6',name:'حقوق',type:'inc',icon:'💵'},{id:'c7',name:'قرض دادم',type:'lend',icon:'🤝'},{id:'c8',name:'قرض گرفتم',type:'borrow',icon:'🔄'}],cards:[{id:'k1',name:'کارت اصلی',acct:''}],tx:[],loans:[],inst:[],unit:'ریال'};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function fix(){if(!S.srcs)S.srcs=[{id:'s1',name:'حقوق'}];S.cats.forEach(c=>{if(!c.icon)c.icon=c.type==='exp'?'🛒':c.type==='inc'?'💵':'🤝'});
if(!S.cards||!S.cards.length)S.cards=[{id:'k1',name:'کارت اصلی',acct:''}]}fix();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};
const go=k=>{tab=k;render();scrollTo(0,0)};
const fi=el=>{const n=norm(el.value).replace(/[^\d.]/g,''),[a,b]=n.split('.');el.value=(a?(+a).toLocaleString('en-US'):'')+(b!==undefined?'.'+b:'');return el.value};
const AH=()=>({apikey:CFG.key,'Content-Type':'application/json'});
async function api(p,o={},retry=1){const r=await fetch(CFG.url+p,{...o,headers:{...AH(),Authorization:'Bearer '+A.t,...(o.headers||{})}});if(r.status===401&&retry){await refresh();return api(p,o,0)}if(!r.ok)throw r;return r.json().catch(()=>null)}
async function refresh(){const r=await fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:AH(),body:JSON.stringify({refresh_token:A.r})}),d=await r.json();if(!d.access_token)throw 0;A.t=d.access_token;A.r=d.refresh_token;localStorage.setItem(AK,JSON.stringify(A))}
function push(){if(!A||!CFG.url)return;clearTimeout(tm);tm=setTimeout(async()=>{try{await api('/rest/v1/states',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:A.id,data:S})});sy='همگام شد ✓'}catch(e){sy='خطا در همگام‌سازی'}},800)}
async function pull(){const d=await api('/rest/v1/states?select=data&user_id=eq.'+A.id);if(d&&d[0]&&d[0].data&&d[0].data.tx){S=Object.assign(S,d[0].data);fix();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}sy='همگام شد ✓'}else push()}
async function auth(k){const u=document.getElementById('lu').value.trim().toLowerCase(),p=document.getElementById('lp').value;if(!/^[a-z0-9_.]{3,}$/.test(u)){alert('نام کاربری: حداقل 3 حرف انگلیسی/عدد');return}
  try{const r=await fetch(CFG.url+'/auth/v1/'+(k==='up'?'signup':'token?grant_type=password'),{method:'POST',headers:AH(),body:JSON.stringify({email:u+'@hesab.app',password:p})}),d=await r.json();if(!d.access_token)throw d;A={t:d.access_token,r:d.refresh_token,id:d.user.id,u};localStorage.setItem(AK,JSON.stringify(A));await pull();render()}catch(e){alert('ناموفق: '+(e.msg||e.error_description||e.message||'خطا'))}}
const logout=()=>{A=null;localStorage.removeItem(AK);render()};
function acct(){if(!CFG.url)return '';
  if(A)return `<h2>حساب کاربری</h2><div class="card row"><span>👤 ${esc(A.u)}<div class="mut">${sy}</div></span><button class="g" onclick="logout()">خروج</button></div>`;
  return '<h2>ورود / ثبت‌نام</h2><div class="card"><input id="lu" dir="ltr" autocapitalize="off" placeholder="نام کاربری (انگلیسی)"><input id="lp" dir="ltr" type="password" placeholder="رمز عبور (حداقل 6 کاراکتر)"><div class="row"><button class="p" onclick="auth(\'in\')">ورود</button><button class="g" onclick="auth(\'up\')">ثبت‌نام</button></div></div>'}
const srcSet=()=>'<h2>منابع درآمد</h2>'+S.srcs.map(x=>`<div class="card row"><span>💼 ${esc(x.name)}</span><button class="x" onclick="delSrc('${x.id}')">×</button></div>`).join('')+'<div class="card"><input id="sN" placeholder="نام منبع (مثلا شرکت الف)"><button class="p" onclick="addSrc()">افزودن منبع</button></div>';
const addSrc=()=>{const n=document.getElementById('sN').value.trim();if(n){S.srcs.push({id:uid(),name:n});save();render()}},delSrc=id=>ask('منبع حذف شود؟',()=>S.srcs=S.srcs.filter(x=>x.id!==id));
const short=n=>n>=1e9?(n/1e9).toFixed(1).replace('.0','')+'B':n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e3?Math.round(n/1e3)+'K':String(Math.round(n));
let im=0;
function instChart(){const u=upcoming(6),mx=Math.max(1,...u.v),W=320,H=180,p=30,X=i=>p+i*(W-2*p)/5,Yy=v=>H-30-v/mx*(H-85);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${p-10}" x2="${W-p+10}" y1="${H-30}" y2="${H-30}" stroke="var(--line)"/><polyline fill="none" stroke="var(--amb)" stroke-width="2.5" stroke-linejoin="round" points="${u.v.map((v,i)=>X(i)+','+Yy(v)).join(' ')}"/>`+u.v.map((v,i)=>`<g class="lk" onclick="im=${i};render()"><circle cx="${X(i)}" cy="${Yy(v)}" r="${i===im?7:5}" fill="${i===im?'var(--acc)':'var(--amb)'}"/><circle cx="${X(i)}" cy="${Yy(v)}" r="16" fill="transparent"/><text x="${X(i)}" y="${Yy(v)-22}" font-size="9" text-anchor="middle" style="fill:var(--tx)">${u.det[i].length} قسط</text><text x="${X(i)}" y="${Yy(v)-11}" font-size="9" text-anchor="middle">${short(v/U())}</text><text x="${X(i)}" y="${H-12}" font-size="9" text-anchor="middle">${MN[M(u.ms[i])-1]}</text></g>`).join('')+'</svg>'}
function instDet(){const u=upcoming(6),d=u.det[im]||[];return `<div class="mut" style="margin-top:8px">${MN[M(u.ms[im])-1]} ${Y(u.ms[im])} · ${d.length} قسط · ${money(u.v[im])}</div>`+(d.length?d.map(x=>`<div class="row" style="margin:6px 0"><span>${esc(x.t)}<div class="mut">قسط ${x.no} از ${x.of} · سررسید ${dstr(x.d)}</div></span><b class="amb">${money(x.a)}</b></div>`).join(''):'<div class="mut">قسطی نیست.</div>')}
function gbar(labels,ser){const W=320,H=165,p=20,mx=Math.max(1,...ser.flatMap(x=>x.vals)),g=(W-2*p)/labels.length,bw=Math.min(14,g/(ser.length+1));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><text x="${p}" y="12" font-size="9">${fmt(mx/U())}</text><line x1="${p}" x2="${W-p}" y1="${H-22}" y2="${H-22}" stroke="var(--line)"/>`+labels.map((l,i)=>ser.map((x,j)=>{const h=x.vals[i]/mx*(H-50);return `<rect x="${p+i*g+g/2+(j-ser.length/2)*bw}" y="${H-22-h}" width="${bw-2}" height="${h}" rx="3" fill="${x.color}"/>`}).join('')+`<text x="${p+i*g+g/2}" y="${H-7}" font-size="9" text-anchor="middle">${l}</text>`).join('')+`</svg><div class="row" style="justify-content:center">${ser.map(x=>`<span class="leg"><i style="background:${x.color}"></i>${x.name}</span>`).join('')}</div>`}
function allChart(){const ms=lastMonths(6),g=(k,m)=>S.tx.filter(t=>t.kind===k&&Y(t.date)===Y(m)&&M(t.date)===M(m)).reduce((a,t)=>a+t.amount,0);return gbar(ms.map(m=>MN[M(m)-1]),[{name:'درآمد',color:'#15803d',vals:ms.map(m=>g('inc',m))},{name:'خرج',color:'#c0392b',vals:ms.map(m=>g('exp',m))}])}
function srcChart(){const a=lastMonths(6)[0],t=S.tx.filter(x=>x.kind==='inc'&&x.date>=a),nm=x=>x.src||'بدون منبع',names=[...new Set(t.map(nm))],sm=(n,it)=>t.filter(x=>nm(x)===n&&(x.itype||'fixed')===it).reduce((q,x)=>q+x.amount,0),rows=names.map(n=>({n,f:sm(n,'fixed'),p:sm(n,'proj')})),mx=Math.max(1,...rows.flatMap(r=>[r.f,r.p]));
  return rows.length?rows.map(r=>`<div style="margin:10px 0"><div class="row"><b>${esc(r.n)}</b><span class="mut">${money(r.f+r.p)}</span></div>${[['ثابت',r.f,'var(--grn)'],['پروژه‌ای',r.p,'var(--amb)']].map(([l,v,c])=>`<div class="row mut"><span style="width:56px">${l}</span><div class="bar" style="flex:1"><i style="width:${v/mx*100}%;background:${c}"></i></div><span style="width:96px;text-align:left" dir="ltr">${fmt(v/U())}</span></div>`).join('')}</div>`).join(''):'<div class="mut">درآمدی ثبت نشده.</div>'}
const dg=t=>t.dong?`<div class="dg">${t.dong.map(p=>`<span>${esc(p.n)} · ${fmt(p.a/U())}</span>`).join('')}</div>`:'';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=()=>S.unit==='تومان'?10:1;
const fmt=n=>Math.round(n).toLocaleString('en-US');
const money=r=>fmt(r/U())+' '+S.unit;
const norm=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\u200e\u200f\u202a-\u202e]/g,'').replace(/[٬،]/g,',').replace(/٫/g,'.');
const num=s=>+norm(s).replace(/,/g,'')||0;
function today(){const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date()),g=t=>+p.find(x=>x.type===t).value;return{y:g('year'),m:g('month'),d:g('day')}}
const key=(y,m,d)=>y*10000+m*100+d;
const Y=k=>Math.floor(k/10000),M=k=>Math.floor(k/100)%100,D=k=>k%100;
const dstr=k=>`${D(k)} ${MN[M(k)-1]} ${Y(k)}`;
const fdate=k=>`${Y(k)}/${String(M(k)).padStart(2,'0')}/${String(D(k)).padStart(2,'0')}`;
function pdate(s){const m=norm(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);return m?key(+m[1],+m[2],+m[3]):null}
const tdKey=()=>{const T=today();return key(T.y,T.m,T.d)};
const dim=m=>m<=6?31:m<=11?30:29;
function addM(k,n){let y=Y(k),m=M(k)+n;while(m>12){m-=12;y++}return key(y,m,Math.min(D(k),dim(m)))}
function parseSms(t){t=norm(t);const T=today(),o={};
  const a=t.match(/[:：]\s*([+\-−]?)\s*([\d,]{3,})/);if(a){o.amount=+a[2].replace(/,/g,'');o.sign=a[1]==='+'?'+':(a[1]?'-':'')}
  const d=t.match(/(\d{2})(\d{2})-(\d{1,2}):(\d{2})/);if(d){o.date=key(T.y,+d[1],+d[2]);o.time=d[3].padStart(2,'0')+':'+d[4]}
  const c=t.match(/حساب\s*[:：]\s*(\d+)/);if(c)o.acct=c[1];return o}
const catOf=id=>S.cats.find(c=>c.id===id),rem=l=>l.amount-l.paid;
let tab='home',F=null,hs='exp',ht='line',lm='person';
const tabs=[['home','🏠','خانه'],['tx','🧾','تراکنش'],['loan','🤝','بدهی/طلب'],['inst','📅','اقساط'],['set','⚙️','تنظیمات']];
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,i,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()"><b>${i}</b>${n}</button>`).join('');
  document.getElementById('app').innerHTML=({home:vHome,tx:vTx,loan:vLoan,inst:vInst,set:vSet})[tab]()}
// charts
function donut(items){const tot=items.reduce((s,i)=>s+i.val,0);if(!tot)return '<div class="mut">داده‌ای نیست.</div>';let off=0;const C=2*Math.PI*38;
  const arcs=items.map((it,i)=>{const len=it.val/tot*C,s=`<circle r="38" cx="50" cy="50" fill="none" stroke="${PAL[i%8]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;off+=len;return s}).join('');
  return `<div class="row"><svg viewBox="0 0 100 100" width="150" height="150" style="transform:rotate(-90deg);flex:none">${arcs}</svg><div style="flex:1;min-width:0">${items.map((it,i)=>`<div class="leg"><i style="background:${PAL[i%8]}"></i><span style="flex:1">${esc(it.label)}</span><b>${Math.round(it.val/tot*100)}%</b></div>`).join('')}</div></div>`}
function line(labels,series){const W=320,H=150,p=24,n=labels.length;const mx=Math.max(1,...series.flatMap(s=>s.vals));

  ${srcSet()}<h2>دسته‌ها</h2>`+S.cats.map(c=>`<div class="card row"><div class="l"><div class="ic">${c.icon}</div><span>${esc(c.name)}<div class="mut">${TYPES[c.type]}</div></span></div><button class="x" onclick="delCat('${c.id}')">×</button></div>`).join('')+
  `<div class="card"><input id="cN" placeholder="نام دستهٔ جدید"><select id="cT">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><div class="mut">آیکون:</div><div class="ig">${ICONS.map((i,n)=>`<span id="ci${n}" class="${n===cIc?'on':''}" onclick="pickIc(${n})">${i}</span>`).join('')}</div><button class="p" onclick="addCat()">افزودن دسته</button></div>
  <h2>پشتیبان‌گیری</h2><div class="card"><button class="g" onclick="exp()">نمایش پشتیبان</button> <button class="g" onclick="imp()">بازیابی</button><textarea id="bk" rows="4" placeholder="متن پشتیبان اینجا میاد. برای بازیابی، متن را بچسبان و «بازیابی» بزن."></textarea><div class="mut">متن را در Notes ذخیره کن، هفته‌ای یک بار.</div></div><div class="mut" style="text-align:center;margin:24px 0 8px">ورژن 1.2</div>`}
let cIc=0;const pickIc=n=>{document.querySelectorAll('.ig span').forEach((s,i)=>s.classList.toggle('on',i===n));cIc=n};
// add sheet
const totalR=()=>num(F.amount)*U();
function people(){const base=totalR(),L=(F.ppl||[]).filter(p=>p.n.trim()).map(p=>({n:p.n.trim(),a:String(p.a).trim()===''?null:num(p.a)*U()})),fx=L.reduce((q,p)=>q+(p.a||0),0),un=L.filter(p=>p.a==null).length,eq=F.share!==''?num(F.share)*U():F.n==='all'?(base-fx)/(un+1):F.n?(base-fx)/F.n:0;L.forEach(p=>{if(p.a==null)p.a=eq});return L}
const addP=()=>{F.ppl.push({n:'',a:''});drawSheet();document.getElementById('pn'+(F.ppl.length-1)).focus()},delP=i=>{F.ppl.splice(i,1);if(!F.ppl.length)F.ppl.push({n:'',a:''});drawSheet()},tgN=n=>{if(F.n===n&&F.share==='')F.n=null;else{F.n=n;F.share=''}drawSheet()};
function openAdd(sms){F={sms:sms||'',amount:'',date:fdate(tdKey()),time:'',note:'',cat:null,person:'',card:S.cards[0].id,dong:false,n:2,names:'',share:'',src:(S.srcs[0]||{}).name||'',it:'fixed',ppl:[{n:'',a:''}],edit:null};if(sms)applySms(sms);drawSheet();document.getElementById('sheet').style.display='block'}
function applySms(v){const p=parseSms(v);F.sms=v;if(p.amount)F.amount=String(p.amount/U());if(p.date)F.date=fdate(p.date);if(p.time)F.time=p.time;
  if(p.sign==='+'&&!F.cat){const c=S.cats.find(c=>c.type==='inc');if(c)F.cat=c.id}
  if(p.acct){const k=S.cards.find(c=>c.acct&&(p.acct.endsWith(c.acct)||c.acct.endsWith(p.acct)));if(k)F.card=k.id}}
function fromSms(v){applySms(v);document.getElementById('fA').value=F.amount;document.getElementById('fD').value=F.date;upd()}
function upd(){const el=document.getElementById('sum');if(!el||!F.dong)return;const L=people();el.innerHTML=L.length?L.map(p=>`${esc(p.n)}: ${money(p.a)}`).join(' · ')+`<br>سهم من ${money(totalR()-L.reduce((q,p)=>q+p.a,0))}`:'اسم نفرها را بنویس.'}
function drawSheet(){const c=catOf(F.cat),loan=c&&(c.type==='lend'||c.type==='borrow'),isExp=c&&c.type==='exp',isInc=c&&c.type==='inc';
  document.getElementById('sheetIn').innerHTML=`<div class="row"><b>${F.edit?'ویرایش تراکنش':'ثبت تراکنش'}</b><button class="x" onclick="closeSheet()">×</button></div>
  <textarea rows="3" placeholder="متن پیامک بانک را اینجا بچسبان (اختیاری)" oninput="fromSms(this.value)">${esc(F.sms)}</textarea>
  <input id="fA" inputmode="decimal" placeholder="مبلغ (${S.unit})" value="${esc(F.amount)}" oninput="F.amount=fi(this);upd()">
  <input id="fD" placeholder="تاریخ شمسی 1405/07/25" value="${esc(F.date)}" oninput="F.date=this.value">
  <div class="mut">از کدام کارت؟</div><div class="chips">${S.cards.map(k=>`<span class="chip ${k.id===F.card?'on':''}" onclick="F.card='${k.id}';drawSheet()">💳 ${esc(k.name)}</span>`).join('')}</div>
  <div class="mut">این برای چیه؟</div><div class="chips">${S.cats.map(x=>`<span class="chip ${x.id===F.cat?'on':''}" onclick="F.cat='${x.id}';drawSheet()">${x.icon} ${esc(x.name)}</span>`).join('')}</div>
  ${loan?`<input placeholder="${c.type==='lend'?'به چه کسی قرض دادی؟':'از چه کسی قرض گرفتی؟'}" value="${esc(F.person)}" oninput="F.person=this.value">`:''}
  ${isInc?`<div class="mut">منبع درآمد</div><div class="chips">${S.srcs.map(x=>`<span class="chip ${x.name===F.src?'on':''}" onclick="F.src=this.textContent;drawSheet()">${esc(x.name)}</span>`).join('')}</div><div class="seg">${[['fixed','ثابت'],['proj','پروژه‌ای']].map(([k,n])=>`<span class="chip ${F.it===k?'on':''}" onclick="F.it='${k}';drawSheet()">${n}</span>`).join('')}</div>`:''}
  ${isExp?`<label class="sw"><input type="checkbox" ${F.dong?'checked':''} onchange="F.dong=this.checked;drawSheet()">دنگ است؟ (بقیه سهمشان را بدهکارند)</label>`:''}
  ${isExp&&F.dong?`<div class="mut">نفرها: اسم و مبلغ دلخواه (بدون مبلغ = سهم مساوی)</div>${F.ppl.map((p,i)=>`<div class="g2"><input id="pn${i}" placeholder="اسم" value="${esc(p.n)}" oninput="F.ppl[${i}].n=this.value;upd()" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('pa${i}').focus()}"><div class="row" style="gap:2px"><input id="pa${i}" inputmode="decimal" placeholder="مبلغ" value="${esc(p.a)}" oninput="F.ppl[${i}].a=fi(this);upd()" onkeydown="if(event.key==='Enter'){event.preventDefault();addP()}"><button class="x" onclick="delP(${i})">×</button></div></div>`).join('')}<button class="g" style="width:100%;margin-bottom:8px" onclick="addP()">+ نفر جدید</button>
  <div class="mut">روش تقسیم برای بقیه (با لمس دوباره خاموش می‌شود):</div><div class="chips">${[2,3,4,5,'all'].map(n=>`<span class="chip ${F.n===n&&F.share===''?'on':''}" onclick="tgN(${n==='all'?"'all'":n})">${n==='all'?'مساوی بین همه':'÷ '+n}</span>`).join('')}</div><input inputmode="decimal" placeholder="یا سهم مساوی هر نفر را دستی بنویس (${S.unit})" value="${esc(F.share)}" oninput="F.share=fi(this);upd()"><div id="sum" class="mut" style="margin-bottom:8px"></div>`:''}
  <input placeholder="توضیح (اختیاری)" value="${esc(F.note)}" oninput="F.note=this.value">
  <button class="p" style="width:100%" onclick="saveTx()">ذخیره</button>`;upd()}
function closeSheet(){document.getElementById('sheet').style.display='none';F=null}
function saveTx(){const total=totalR(),date=pdate(F.date),c=catOf(F.cat);
  if(!total||!date||!c){alert('مبلغ، تاریخ و دسته را کامل کن.');return}
  const isLoan=c.type==='lend'||c.type==='borrow';if(isLoan&&!F.person.trim()){alert('اسم طرف حساب را بنویس.');return}
  const pp=people(),dong=c.type==='exp'&&F.dong&&pp.length;let mine=total;
  if(dong){if(pp.some(p=>!(p.a>0))){alert('برای همهٔ نفرها مبلغ بنویس یا یک روش تقسیم انتخاب کن.');return}mine=total-pp.reduce((q,p)=>q+p.a,0);if(mine<-0.5){alert('جمع سهم‌ها از کل مبلغ بیشتر است.');return}}
  const id=F.edit||uid(),old=S.loans.filter(l=>l.tx===id),prev=S.tx.find(x=>x.id===id),legacy=prev&&!old.length&&(prev.dong||prev.person);
  const t={id,amount:Math.max(0,mine),total:dong?total:undefined,dong:dong?pp:undefined,src:c.type==='inc'?F.src:undefined,itype:c.type==='inc'?F.it:undefined,date,time:F.time,note:F.note,catId:c.id,cat:c.name,kind:c.type,person:isLoan?F.person.trim():'',card:F.card};
  if(prev)S.tx[S.tx.indexOf(prev)]=t;else S.tx.push(t);
  if(legacy)alert('بدهی/طلب‌های ثبت‌شده برای این تراکنش قدیمی خودکار تغییر نمی‌کنند؛ از صفحهٔ بدهی/طلب اصلاحشان کن.');
  else{S.loans=S.loans.filter(l=>l.tx!==id);const mk=(person,kind,amount,note)=>{const o=old.find(l=>l.person===person&&l.kind===kind);S.loans.push({id:uid(),tx:id,person,kind,amount,paid:Math.min(amount,o?o.paid:0),date,note})};
    if(isLoan)mk(F.person.trim(),c.type,total,F.note);if(dong)pp.forEach(p=>mk(p.n,'lend',p.a,'دنگ '+(F.note||c.name)))}
  save();closeSheet();tab='tx';render()}
const ask=(m,f)=>{if(confirm(m)){f();save();render()}};
const delTx=id=>ask('حذف شود؟',()=>S.tx=S.tx.filter(t=>t.id!==id)),delLoan=id=>ask('حذف شود؟',()=>S.loans=S.loans.filter(t=>t.id!==id)),delInst=id=>ask('حذف شود؟',()=>S.inst=S.inst.filter(t=>t.id!==id));
const delCat=id=>ask('دسته حذف شود؟',()=>S.cats=S.cats.filter(c=>c.id!==id)),delCard=id=>ask('کارت حذف شود؟',()=>{if(S.cards.length>1)S.cards=S.cards.filter(c=>c.id!==id)});
function pay(id){const l=S.loans.find(x=>x.id===id),v=num(document.getElementById('p'+id).value)*U();if(!v)return;l.paid=Math.min(l.amount,l.paid+v);save();render()}
function addInst(){const g=i=>document.getElementById(i).value,amount=num(g('iA'))*U(),total=num(g('iN')),paid=num(g('iP')),due=pdate(g('iD'));
  if(!g('iT')||!amount||!total||!due){alert('عنوان، مبلغ، تعداد و سررسید لازم است.');return}
  S.inst.push({id:uid(),title:g('iT'),amount,total,paid,due,every:+g('iE')});save();render()}
function payInst(id){const i=S.inst.find(x=>x.id===id);i.paid++;i.due=addM(i.due,i.every||1);
  if(confirm('به‌عنوان خرج هم ثبت شود؟')){const c=S.cats.find(c=>c.name==='قسط')||S.cats.find(c=>c.type==='exp');if(c)S.tx.push({id:uid(),amount:i.amount,date:tdKey(),time:'',note:i.title,catId:c.id,cat:c.name,kind:'exp',person:'',card:S.cards[0].id})}save();render()}
function addCat(){const n=document.getElementById('cN').value.trim();if(!n)return;S.cats.push({id:uid(),name:n,type:document.getElementById('cT').value,icon:ICONS[cIc]});save();render()}
function addCard(){const n=document.getElementById('kN').value.trim();if(!n)return;S.cards.push({id:uid(),name:n,acct:norm(document.getElementById('kA').value).trim()});save();render()}
function exp(){document.getElementById('bk').value=JSON.stringify(S)}
function imp(){try{const o=JSON.parse(document.getElementById('bk').value);if(!o.cats||!o.tx)throw 0;if(confirm('اطلاعات فعلی جایگزین شود؟')){S=o;save();location.reload()}}catch(e){alert('متن پشتیبان معتبر نیست.')}}
render();if(A&&CFG.url)pull().then(render).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&A&&CFG.url&&!F)pull().then(render).catch(()=>{})});
try{const h=decodeURIComponent((location.hash||'').replace(/^#/,'')),q=new URLSearchParams(location.search).get('sms'),m=h.match(/^sms=([\s\S]*)/),s=m?m[1]:q;if(s)openAdd(s)}catch(e){}
</script>
</body>
